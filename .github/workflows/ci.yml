name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # This suite imports the real OMP host packages, which import Bun
      # globals and cannot run under the Node-based unit-test command.
      - name: OMP host compatibility
        run: bun test tests/omp-host-compat.test.mjs

      # Kept a separate step rather than folded into the unit glob: this is the
      # Zod cross-version compatibility boundary (SDK-bundled 4.4.3 walker vs a
      # newer host Zod), and it should stay visible by name in CI output. Runs
      # the committed 4.4.3 / 4.5.2 / 4.5.3 / 4.6.5 matrix from pinned
      # devDependency aliases, so it downloads nothing beyond `bun install`.
      - name: Cross-version Zod compatibility
        run: bun run test:crossversion

  omp-19:
    name: OMP ${{ matrix.version }} host compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['19.0.1', '19.1.0']
    env:
      OMP_HOST_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install OMP host dependencies
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const name of Object.keys(manifest.devDependencies)) {
            if (name.startsWith('@oh-my-pi/')) manifest.devDependencies[name] = process.env.OMP_HOST_VERSION;
          }
          writeFileSync('package.json', JSON.stringify(manifest, null, '\t') + '\n');
          JS
          bun install

      # The 19.1.0 npm package omits this source import. Restore the released
      # source for the host tests, which import OMP sources instead of its CLI bundle.
      - name: Restore the OMP 19.1.0 browser relay import
        if: matrix.version == '19.1.0'
        working-directory: node_modules/@oh-my-pi
        run: |
          mkdir -p browser-relay/extension
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/can1357/oh-my-pi/a7135b8f31826c878734388b648f52bed8da436e/packages/browser-relay/extension/messages.ts \
            --output browser-relay/extension/messages.ts
          ln -s pi-coding-agent coding-agent

      - name: Typecheck and test the host integration
        run: |
          bun run typecheck
          bun test tests/omp-host-compat.test.mjs
          bun test ./tests/unit-model-discovery.mjs
